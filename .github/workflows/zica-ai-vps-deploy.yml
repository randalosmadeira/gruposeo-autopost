name: Deploy Zica.ai Orchestrator VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/zica-orchestrator/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/zica-ai-vps-deploy.yml'

permissions:
  contents: read

concurrency:
  group: zica-ai-orchestrator-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy isolated Zica.ai runtime
    runs-on: ubuntu-latest
    environment: zica-ai-production
    timeout-minutes: 40
    env:
      ZICA_AI_VPS_HOST: ${{ secrets.ZICA_AI_VPS_HOST }}
      ZICA_AI_VPS_USER: ${{ secrets.ZICA_AI_VPS_USER }}
      ZICA_AI_VPS_PORT_RAW: ${{ secrets.ZICA_AI_VPS_PORT }}
      ZICA_AI_VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.ZICA_AI_VPS_SSH_PRIVATE_KEY_B64 }}
      ZICA_AI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ZICA_AI_SUPABASE_SERVICE_ROLE_KEY }}
      ZICA_AI_SUPABASE_URL: https://ubahrbgaxrkjxklytobl.supabase.co
      VITE_SUPABASE_URL: https://ubahrbgaxrkjxklytobl.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8XzHfqXP8o3XOcGwRY35zw_P-jg1kiE
      VITE_APP_NAME: Zica.ai
      TARGET_HOST: app.zica.posts.zicajuris.com.br
      TARGET_URL: https://app.zica.posts.zicajuris.com.br

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate dedicated Zica.ai secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZICA_AI_VPS_HOST" || { echo "::error::ZICA_AI_VPS_HOST ausente"; exit 1; }
          test -n "$ZICA_AI_VPS_USER" || { echo "::error::ZICA_AI_VPS_USER ausente"; exit 1; }
          test -n "$ZICA_AI_VPS_SSH_PRIVATE_KEY_B64" || { echo "::error::ZICA_AI_VPS_SSH_PRIVATE_KEY_B64 ausente"; exit 1; }
          test -n "$ZICA_AI_SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::ZICA_AI_SUPABASE_SERVICE_ROLE_KEY ausente"; exit 1; }
          ZICA_AI_VPS_PORT="${ZICA_AI_VPS_PORT_RAW:-22}"
          case "$ZICA_AI_VPS_PORT" in (*[!0-9]*|'') echo "::error::ZICA_AI_VPS_PORT inválida"; exit 1;; esac
          echo "ZICA_AI_VPS_PORT=$ZICA_AI_VPS_PORT" >> "$GITHUB_ENV"

      - name: Build Zica.ai frontend gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run test:zica
          npm run build:zica
          test -f dist/index.html

      - name: Build orchestrator gate
        working-directory: services/zica-orchestrator
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -f dist/server.js
          test -f dist/worker.js

      - name: Configure dedicated SSH identity
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$ZICA_AI_VPS_SSH_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.ssh/zica_ai_deploy"
          chmod 600 "$HOME/.ssh/zica_ai_deploy"
          grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----$' "$HOME/.ssh/zica_ai_deploy"
          ssh-keygen -y -f "$HOME/.ssh/zica_ai_deploy" >/dev/null
          ssh-keyscan -p "$ZICA_AI_VPS_PORT" -H "$ZICA_AI_VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package isolated Zica.ai release
        shell: bash
        run: |
          set -euo pipefail
          tar -C services/zica-orchestrator -czf "/tmp/zica-ai-orchestrator-$GITHUB_SHA.tgz" --exclude=node_modules --exclude=dist .
          tar -C dist -czf "/tmp/zica-ai-frontend-$GITHUB_SHA.tgz" .
          test -s "/tmp/zica-ai-orchestrator-$GITHUB_SHA.tgz"
          test -s "/tmp/zica-ai-frontend-$GITHUB_SHA.tgz"
          umask 077
          {
            printf 'PORT=8787\n'
            printf 'SUPABASE_URL=%s\n' "$ZICA_AI_SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$ZICA_AI_SUPABASE_SERVICE_ROLE_KEY"
            printf 'ZICA_CREDENTIALS_JSON={}\n'
            printf 'AI_PROVIDER=none\n'
            printf 'OPENAI_API_KEY=\n'
            printf 'OPENAI_MODEL=gpt-5-mini\n'
            printf 'ANTHROPIC_API_KEY=\n'
            printf 'ANTHROPIC_MODEL=claude-sonnet-4-5\n'
          } > /tmp/zica-ai.env.partial
          chmod 600 /tmp/zica-ai.env.partial

      - name: Upload isolated release
        shell: bash
        run: |
          set -euo pipefail
          SCP=(scp -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/zica_ai_deploy" -P "$ZICA_AI_VPS_PORT")
          "${SCP[@]}" "/tmp/zica-ai-orchestrator-$GITHUB_SHA.tgz" "$ZICA_AI_VPS_USER@$ZICA_AI_VPS_HOST:/tmp/zica-ai-orchestrator-$GITHUB_SHA.tgz"
          "${SCP[@]}" "/tmp/zica-ai-frontend-$GITHUB_SHA.tgz" "$ZICA_AI_VPS_USER@$ZICA_AI_VPS_HOST:/tmp/zica-ai-frontend-$GITHUB_SHA.tgz"
          "${SCP[@]}" /tmp/zica-ai.env.partial "$ZICA_AI_VPS_USER@$ZICA_AI_VPS_HOST:/tmp/zica-ai.env.partial"

      - name: Activate isolated Zica.ai stack
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/zica_ai_deploy" -p "$ZICA_AI_VPS_PORT" "$ZICA_AI_VPS_USER@$ZICA_AI_VPS_HOST" \
            "ZICA_SHA='$GITHUB_SHA' TARGET_HOST='$TARGET_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          ORCH_ROOT=/opt/zica-ai/orchestrator
          FRONT_ROOT=/opt/zica-ai/frontend
          ORCH_RELEASE="$ORCH_ROOT/releases/$ZICA_SHA"
          FRONT_RELEASE="$FRONT_ROOT/releases/$ZICA_SHA"
          ORCH_SHARED="$ORCH_ROOT/shared"
          ENV_FILE="$ORCH_SHARED/.env.production"
          PASS_FILE="$ORCH_SHARED/redis.password"
          NETWORK=zica-ai-orchestrator-net
          REDIS=zica-ai-orchestrator-redis
          API=zica-ai-orchestrator-api
          WORKER=zica-ai-orchestrator-worker
          VOLUME=zica-ai-orchestrator-redis-data
          IMAGE="zica-ai-orchestrator:$ZICA_SHA"

          sudo -n true >/dev/null
          command -v docker >/dev/null
          command -v nginx >/dev/null
          sudo mkdir -p "$ORCH_RELEASE" "$ORCH_SHARED" "$FRONT_RELEASE"
          sudo chown -R "$(id -u):$(id -g)" /opt/zica-ai
          rm -rf "$ORCH_RELEASE"/* "$FRONT_RELEASE"/*
          tar -xzf "/tmp/zica-ai-orchestrator-$ZICA_SHA.tgz" -C "$ORCH_RELEASE"
          tar -xzf "/tmp/zica-ai-frontend-$ZICA_SHA.tgz" -C "$FRONT_RELEASE"
          test -f "$FRONT_RELEASE/index.html"

          if [ ! -s "$PASS_FILE" ]; then
            umask 077
            openssl rand -hex 32 > "$PASS_FILE"
          fi
          REDIS_PASSWORD="$(cat "$PASS_FILE")"
          umask 077
          cp /tmp/zica-ai.env.partial "$ENV_FILE"
          printf 'REDIS_URL=redis://:%s@%s:6379\n' "$REDIS_PASSWORD" "$REDIS" >> "$ENV_FILE"
          chmod 600 "$ENV_FILE" "$PASS_FILE"
          rm -f /tmp/zica-ai.env.partial

          docker network inspect "$NETWORK" >/dev/null 2>&1 || docker network create "$NETWORK" >/dev/null
          docker volume inspect "$VOLUME" >/dev/null 2>&1 || docker volume create "$VOLUME" >/dev/null
          cd "$ORCH_RELEASE"
          docker build --pull -t "$IMAGE" .

          if ! docker inspect "$REDIS" >/dev/null 2>&1; then
            docker run -d --name "$REDIS" --restart unless-stopped \
              --network "$NETWORK" --memory 512m --cpus 0.50 \
              --security-opt no-new-privileges:true -v "$VOLUME":/data \
              redis:7-alpine redis-server --appendonly yes --requirepass "$REDIS_PASSWORD" >/dev/null
          else
            docker start "$REDIS" >/dev/null 2>&1 || true
          fi

          docker rm -f "$API" "$WORKER" >/dev/null 2>&1 || true
          docker run -d --name "$API" --restart unless-stopped \
            --network "$NETWORK" --memory 768m --cpus 0.75 \
            --security-opt no-new-privileges:true --env-file "$ENV_FILE" \
            -p 127.0.0.1:8787:8787 "$IMAGE" >/dev/null
          docker run -d --name "$WORKER" --restart unless-stopped \
            --network "$NETWORK" --memory 1536m --cpus 1.25 \
            --security-opt no-new-privileges:true --env-file "$ENV_FILE" \
            "$IMAGE" node dist/worker.js >/dev/null

          READY=false
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:8787/health | grep -q '"service":"zica-orchestrator"'; then READY=true; break; fi
            sleep 5
          done
          if [ "$READY" != true ]; then
            docker logs --tail 120 "$API" >&2 || true
            docker logs --tail 120 "$WORKER" >&2 || true
            exit 1
          fi

          ln -sfn "$ORCH_RELEASE" "$ORCH_ROOT/current"
          ln -sfn "$FRONT_RELEASE" "$FRONT_ROOT/current"

          NGINX_DUMP="$(sudo nginx -T 2>&1)"
          NGINX_LINK=''
          if printf '%s\n' "$NGINX_DUMP" | grep -Eq 'include[[:space:]]+/etc/nginx/conf\.d/\*\.conf'; then
            sudo mkdir -p /etc/nginx/conf.d
            NGINX_FILE=/etc/nginx/conf.d/zica-ai-orchestrator.conf
          elif printf '%s\n' "$NGINX_DUMP" | grep -Eq 'include[[:space:]]+/etc/nginx/sites-enabled/\*'; then
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            NGINX_FILE=/etc/nginx/sites-available/zica-ai-orchestrator
            NGINX_LINK=/etc/nginx/sites-enabled/zica-ai-orchestrator
          else
            echo 'ERRO: layout de includes do Nginx não reconhecido.' >&2
            exit 1
          fi

          sudo tee "$NGINX_FILE" >/dev/null <<NGINX
          server {
              listen 80;
              server_name ${TARGET_HOST};
              root ${FRONT_ROOT}/current;
              index index.html;
              client_max_body_size 4m;

              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;

              location = /health {
                  proxy_pass http://127.0.0.1:8787/health;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }

              location = /webhooks/wordpress {
                  proxy_pass http://127.0.0.1:8787/webhooks/wordpress;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_read_timeout 90s;
              }

              location /assets/ {
                  try_files \$uri =404;
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }

              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }
          NGINX
          if [ -n "$NGINX_LINK" ]; then
            sudo ln -sfn "$NGINX_FILE" "$NGINX_LINK"
          fi
          sudo nginx -t
          sudo systemctl reload nginx || sudo nginx -s reload

          if getent ahostsv4 "$TARGET_HOST" >/dev/null 2>&1 && command -v certbot >/dev/null 2>&1; then
            sudo certbot --nginx -d "$TARGET_HOST" --non-interactive --agree-tos --register-unsafely-without-email --redirect
          fi

          printf '%s\n' "$ZICA_SHA" > "$ORCH_SHARED/current.sha"
          rm -f "/tmp/zica-ai-orchestrator-$ZICA_SHA.tgz" "/tmp/zica-ai-frontend-$ZICA_SHA.tgz"
          mapfile -t OLD_ORCH < <(ls -1dt "$ORCH_ROOT"/releases/* 2>/dev/null | tail -n +6 || true)
          if [ "${#OLD_ORCH[@]}" -gt 0 ]; then rm -rf -- "${OLD_ORCH[@]}"; fi
          mapfile -t OLD_FRONT < <(ls -1dt "$FRONT_ROOT"/releases/* 2>/dev/null | tail -n +6 || true)
          if [ "${#OLD_FRONT[@]}" -gt 0 ]; then rm -rf -- "${OLD_FRONT[@]}"; fi
          REMOTE

      - name: Verify local runtime over SSH
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/zica_ai_deploy" -p "$ZICA_AI_VPS_PORT" "$ZICA_AI_VPS_USER@$ZICA_AI_VPS_HOST" 'curl --fail --silent http://127.0.0.1:8787/health')"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"service":"zica-orchestrator"'
          echo "$BODY" | grep -q '"version":"3.10.2"'
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/zica_ai_deploy" -p "$ZICA_AI_VPS_PORT" "$ZICA_AI_VPS_USER@$ZICA_AI_VPS_HOST" 'test -f /opt/zica-ai/frontend/current/index.html'

      - name: Verify public application
        shell: bash
        run: |
          set -euo pipefail
          if getent ahostsv4 "$TARGET_HOST" >/dev/null 2>&1; then
            ROOT="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 "$TARGET_URL/")"
            echo "$ROOT" | grep -q 'id="root"'
            HEALTH="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 "$TARGET_URL/health")"
            echo "$HEALTH" | grep -q '"ok":true'
            echo "$HEALTH" | grep -q '"version":"3.10.2"'
          else
            echo "DNS ainda não resolve; frontend e runtime foram instalados localmente."
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Zica.ai production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`zica-ai-production\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: \`/opt/zica-ai/frontend\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Orchestrator: \`/opt/zica-ai/orchestrator\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public URL: \`$TARGET_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- No ZicaJuris files, credentials or containers are used." >> "$GITHUB_STEP_SUMMARY"
