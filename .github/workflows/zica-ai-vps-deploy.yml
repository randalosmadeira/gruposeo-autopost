name: Deploy Zica.ai Orchestrator VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/zica-orchestrator/**'
      - '.github/workflows/zica-ai-vps-deploy.yml'

permissions:
  contents: read

concurrency:
  group: zica-ai-orchestrator-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated Zica.ai runtime
    runs-on: ubuntu-latest
    environment: zica-ai-production
    timeout-minutes: 40
    env:
      ZICA_AI_VPS_HOST: ${{ secrets.ZICA_AI_VPS_HOST }}
      ZICA_AI_VPS_USER: ${{ secrets.ZICA_AI_VPS_USER }}
      ZICA_AI_VPS_PORT_RAW: ${{ secrets.ZICA_AI_VPS_PORT }}
      ZICA_AI_VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.ZICA_AI_VPS_SSH_PRIVATE_KEY_B64 }}
      ZICA_AI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ZICA_AI_SUPABASE_SERVICE_ROLE_KEY }}
      ZICA_AI_CREDENTIALS_JSON: ${{ secrets.ZICA_AI_CREDENTIALS_JSON }}
      ZICA_AI_SUPABASE_URL: https://ubahrbgaxrkjxklytobl.supabase.co
      TARGET_HOST: app.zica.posts.zicajuris.com.br
      TARGET_URL: https://app.zica.posts.zicajuris.com.br

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate dedicated Zica.ai secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZICA_AI_VPS_HOST" || { echo "::error::ZICA_AI_VPS_HOST ausente"; exit 1; }
          test -n "$ZICA_AI_VPS_USER" || { echo "::error::ZICA_AI_VPS_USER ausente"; exit 1; }
          test -n "$ZICA_AI_VPS_SSH_PRIVATE_KEY_B64" || { echo "::error::ZICA_AI_VPS_SSH_PRIVATE_KEY_B64 ausente"; exit 1; }
          test -n "$ZICA_AI_SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::ZICA_AI_SUPABASE_SERVICE_ROLE_KEY ausente"; exit 1; }
          ZICA_AI_VPS_PORT="${ZICA_AI_VPS_PORT_RAW:-22}"
          case "$ZICA_AI_VPS_PORT" in (*[!0-9]*|'') echo "::error::ZICA_AI_VPS_PORT inválida"; exit 1;; esac
          echo "ZICA_AI_VPS_PORT=$ZICA_AI_VPS_PORT" >> "$GITHUB_ENV"

      - name: Build orchestrator gate
        working-directory: services/zica-orchestrator
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -f dist/server.js
          test -f dist/worker.js

      - name: Configure dedicated SSH identity
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$ZICA_AI_VPS_SSH_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.ssh/zica_ai_deploy"
          chmod 600 "$HOME/.ssh/zica_ai_deploy"
          grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----$' "$HOME/.ssh/zica_ai_deploy"
          ssh-keygen -y -f "$HOME/.ssh/zica_ai_deploy" >/dev/null
          ssh-keyscan -p "$ZICA_AI_VPS_PORT" -H "$ZICA_AI_VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package isolated Zica.ai release
        shell: bash
        run: |
          set -euo pipefail
          tar -C services/zica-orchestrator -czf "/tmp/zica-ai-$GITHUB_SHA.tgz" --exclude=node_modules --exclude=dist .
          test -s "/tmp/zica-ai-$GITHUB_SHA.tgz"
          umask 077
          {
            printf 'PORT=8787\n'
            printf 'SUPABASE_URL=%s\n' "$ZICA_AI_SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$ZICA_AI_SUPABASE_SERVICE_ROLE_KEY"
            printf 'ZICA_CREDENTIALS_JSON=%s\n' "${ZICA_AI_CREDENTIALS_JSON:-{}}"
            printf 'AI_PROVIDER=none\n'
            printf 'OPENAI_API_KEY=\n'
            printf 'OPENAI_MODEL=gpt-5-mini\n'
            printf 'ANTHROPIC_API_KEY=\n'
            printf 'ANTHROPIC_MODEL=claude-sonnet-4-5\n'
          } > /tmp/zica-ai.env.partial
          chmod 600 /tmp/zica-ai.env.partial

      - name: Upload isolated release
        shell: bash
        run: |
          set -euo pipefail
          SCP=(scp -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/zica_ai_deploy" -P "$ZICA_AI_VPS_PORT")
          "${SCP[@]}" "/tmp/zica-ai-$GITHUB_SHA.tgz" "$ZICA_AI_VPS_USER@$ZICA_AI_VPS_HOST:/tmp/zica-ai-$GITHUB_SHA.tgz"
          "${SCP[@]}" /tmp/zica-ai.env.partial "$ZICA_AI_VPS_USER@$ZICA_AI_VPS_HOST:/tmp/zica-ai.env.partial"

      - name: Activate isolated Zica.ai stack
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/zica_ai_deploy" -p "$ZICA_AI_VPS_PORT" "$ZICA_AI_VPS_USER@$ZICA_AI_VPS_HOST" \
            "ZICA_SHA='$GITHUB_SHA' TARGET_HOST='$TARGET_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          ROOT=/opt/zica-ai/orchestrator
          RELEASE="$ROOT/releases/$ZICA_SHA"
          SHARED="$ROOT/shared"
          ENV_FILE="$SHARED/.env.production"
          PASS_FILE="$SHARED/redis.password"
          NETWORK=zica-ai-orchestrator-net
          REDIS=zica-ai-orchestrator-redis
          API=zica-ai-orchestrator-api
          WORKER=zica-ai-orchestrator-worker
          VOLUME=zica-ai-orchestrator-redis-data
          IMAGE="zica-ai-orchestrator:$ZICA_SHA"

          sudo -n true >/dev/null
          command -v docker >/dev/null
          command -v nginx >/dev/null
          sudo mkdir -p "$RELEASE" "$SHARED"
          sudo chown -R "$(id -u):$(id -g)" /opt/zica-ai
          rm -rf "$RELEASE"/*
          tar -xzf "/tmp/zica-ai-$ZICA_SHA.tgz" -C "$RELEASE"

          if [ ! -s "$PASS_FILE" ]; then
            umask 077
            openssl rand -hex 32 > "$PASS_FILE"
          fi
          REDIS_PASSWORD="$(cat "$PASS_FILE")"
          umask 077
          cp /tmp/zica-ai.env.partial "$ENV_FILE"
          printf 'REDIS_URL=redis://:%s@%s:6379\n' "$REDIS_PASSWORD" "$REDIS" >> "$ENV_FILE"
          chmod 600 "$ENV_FILE" "$PASS_FILE"
          rm -f /tmp/zica-ai.env.partial

          docker network inspect "$NETWORK" >/dev/null 2>&1 || docker network create "$NETWORK" >/dev/null
          docker volume inspect "$VOLUME" >/dev/null 2>&1 || docker volume create "$VOLUME" >/dev/null
          cd "$RELEASE"
          docker build --pull -t "$IMAGE" .

          if ! docker inspect "$REDIS" >/dev/null 2>&1; then
            docker run -d --name "$REDIS" --restart unless-stopped \
              --network "$NETWORK" --memory 512m --cpus 0.50 \
              --security-opt no-new-privileges:true -v "$VOLUME":/data \
              redis:7-alpine redis-server --appendonly yes --requirepass "$REDIS_PASSWORD" >/dev/null
          else
            docker start "$REDIS" >/dev/null 2>&1 || true
          fi

          docker rm -f "$API" "$WORKER" >/dev/null 2>&1 || true
          docker run -d --name "$API" --restart unless-stopped \
            --network "$NETWORK" --memory 768m --cpus 0.75 \
            --security-opt no-new-privileges:true --env-file "$ENV_FILE" \
            -p 127.0.0.1:8787:8787 "$IMAGE" >/dev/null
          docker run -d --name "$WORKER" --restart unless-stopped \
            --network "$NETWORK" --memory 1536m --cpus 1.25 \
            --security-opt no-new-privileges:true --env-file "$ENV_FILE" \
            "$IMAGE" node dist/worker.js >/dev/null

          READY=false
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:8787/health | grep -q '"service":"zica-orchestrator"'; then READY=true; break; fi
            sleep 5
          done
          if [ "$READY" != true ]; then
            docker logs --tail 120 "$API" >&2 || true
            docker logs --tail 120 "$WORKER" >&2 || true
            exit 1
          fi

          NGINX_FILE=/etc/nginx/sites-available/zica-ai-orchestrator
          sudo tee "$NGINX_FILE" >/dev/null <<NGINX
          server {
              listen 80;
              server_name ${TARGET_HOST};
              client_max_body_size 4m;
              location / {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_read_timeout 90s;
              }
          }
          NGINX
          sudo ln -sfn "$NGINX_FILE" /etc/nginx/sites-enabled/zica-ai-orchestrator
          sudo nginx -t
          sudo systemctl reload nginx

          if getent ahostsv4 "$TARGET_HOST" >/dev/null 2>&1; then
            if command -v certbot >/dev/null 2>&1; then
              sudo certbot --nginx -d "$TARGET_HOST" --non-interactive --agree-tos --register-unsafely-without-email --redirect
              echo 'public_tls=configured'
            else
              echo 'public_tls=pending_certbot'
            fi
          else
            echo 'public_tls=pending_dns'
          fi

          printf '%s\n' "$ZICA_SHA" > "$SHARED/current.sha"
          ln -sfn "$RELEASE" "$ROOT/current"
          rm -f "/tmp/zica-ai-$ZICA_SHA.tgz"
          mapfile -t OLD < <(ls -1dt "$ROOT"/releases/* 2>/dev/null | tail -n +6 || true)
          if [ "${#OLD[@]}" -gt 0 ]; then rm -rf -- "${OLD[@]}"; fi
          REMOTE

      - name: Verify local runtime over SSH
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/zica_ai_deploy" -p "$ZICA_AI_VPS_PORT" "$ZICA_AI_VPS_USER@$ZICA_AI_VPS_HOST" 'curl --fail --silent http://127.0.0.1:8787/health')"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"service":"zica-orchestrator"'
          echo "$BODY" | grep -q '"version":"3.10.2"'

      - name: Verify public endpoint when DNS is ready
        shell: bash
        run: |
          set -euo pipefail
          if getent ahostsv4 "$TARGET_HOST" >/dev/null 2>&1; then
            BODY="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 "$TARGET_URL/health")"
            echo "$BODY" | grep -q '"ok":true'
            echo "$BODY" | grep -q '"service":"zica-orchestrator"'
            echo "$BODY" | grep -q '"version":"3.10.2"'
          else
            echo "DNS ainda não resolve; runtime local validado e publicação HTTPS pendente apenas de DNS."
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Zica.ai Orchestrator deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`zica-ai-production\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL alvo: \`$TARGET_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Root isolado: \`/opt/zica-ai/orchestrator\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SSH: secret Base64 exclusivo do Zica.ai" >> "$GITHUB_STEP_SUMMARY"
          echo "- No ZicaJuris files, credentials or containers are used." >> "$GITHUB_STEP_SUMMARY"
