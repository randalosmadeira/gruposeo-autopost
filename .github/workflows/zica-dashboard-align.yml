name: Zica.ai Dashboard Alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Align dashboard naming
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/pages/DashboardNew.tsx'): {
                  'Cérebro de Tráfego</h1>': 'ZICA.AI - Cérebro de Tráfego Orgânico</h1>',
                  'Ondas orgânicas, GEO e sinais semânticos em uma visão 360°': 'Cérebro Central de Tráfego: Visão 360° da sua máquina de autoridade orgânica e GEO',
                  'title="Total de Artigos"': 'title="Total de Ondas Criadas"',
                  'title="Publicados"': 'title="Artigos Ativos & Indexados"',
                  'title="Projetos Ativos"': 'title="Ecossistemas Conectados"',
                  'title="Agentes de Notícias"': 'title="Agentes Autônomos de Notícias"',
                  'title="Gerar Onda"': 'title="Nova Onda Viral"',
                  'description="Criar artigo com IA"': 'description="Artigo IA Multi-Nicho com GEO e Semântica"',
                  'title="Landing Page"': 'title="Página de Alta Conversão / Vendas"',
                  'description="Página de vendas"': 'description="Landing page orientada à conversão"',
                  'title="Novo Agente"': 'title="Novo Agente Autônomo 24/7"',
                  'description="Automatizar notícias"': 'description="Monitorar e publicar notícias continuamente"',
                  'title="Calendário"': 'title="Calendário de Ondas Editoriais"',
                  'description="Ver linha editorial"': 'description="Planejar ondas e linha editorial"',
                  'Conteúdo Recente': 'Ondas de Conteúdo Recentes',
              },
              Path('src/components/dashboard/SEOAgentPanel.tsx'): {
                  'Agente SEO Autônomo': 'Agente SEO & GEO Autônomo',
                  '>v3.6.0<': '>v4.0<',
                  'Executar Agora': 'Disparar Agente Autônomo Agora',
                  '>Auditoria<': '>Auditoria GEO<',
                  '>Correções<': '>Correções 24/7<',
                  "label: 'Links Aplicados'": "label: 'Links Internos Aplicados'",
                  "label: 'URLs Indexadas'": "label: 'URLs Indexadas (IndexNow/LLMs)'",
                  "label: '404s Corrigidos'": "label: '404s Auto-Corrigidos'",
                  "label: 'SEO Score'": "label: 'Score de Autoridade LLMs'",
              },
          }

          changed = []
          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in mapping.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit aligned dashboard
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "Zica.ai Automation"
          git config user.email "automation@users.noreply.github.com"
          git add src/pages/DashboardNew.tsx src/components/dashboard/SEOAgentPanel.tsx
          git commit -m "feat: align dashboard with Zica.ai product specification"
          git push origin HEAD:main
