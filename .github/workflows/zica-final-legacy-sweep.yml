name: Zica.ai Final Legacy Sweep

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace legacy transport and visible branding residues
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'https://contentfactory.rdm.com.br/changelog': 'https://zica.ai/changelog',
              "'X-CFRDM-API-Key' => $api_key": "'X-ZICA-AI-API-Key' => $api_key",
              'do Grupo SEO Marketing.': 'da Zica.ai.',
          }
          changed = []
          for root in [Path('src'), Path('public/wordpress-plugin/zica-ai')]:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.ts','.tsx','.js','.php','.md','.txt','.json'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  original = text
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed.append(str(path))
          print('changed:', ', '.join(changed) if changed else 'none')
          PY

      - name: Validate PHP syntax
        run: find public/wordpress-plugin/zica-ai -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Commit sweep
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "Zica.ai Automation"
          git config user.email "automation@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove final Zica.ai legacy transport residues"
          git push origin HEAD:main
