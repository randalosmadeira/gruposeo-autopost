name: Zica.ai CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Supabase publishable credentials are browser-side identifiers; authorization is enforced by RLS.
      VITE_SUPABASE_URL: https://ubahrbgaxrkjxklytobl.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8XzHfqXP8o3XOcGwRY35zw_P-jg1kiE
      VITE_APP_NAME: Zica.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce private deployment boundaries
        run: node scripts/verify-private-deployment-boundaries.mjs

      - name: Validate runtime config
        if: github.event_name == 'push'
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "VITE_SUPABASE_URL ausente" >&2; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "VITE_SUPABASE_PUBLISHABLE_KEY ausente" >&2; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint report
        continue-on-error: true
        run: npm run lint

      - name: Test Zica.ai
        run: npm run test:zica

      - name: Build Zica.ai
        run: npm run build:zica

      - name: Build Zica Orchestrator
        working-directory: services/zica-orchestrator
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -f dist/server.js
          test -f dist/worker.js

      - name: Upload Zica.ai production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zica-ai-web-dist
          path: dist
          if-no-files-found: error
