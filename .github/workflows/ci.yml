name: Zica.ai CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint report
        continue-on-error: true
        run: npm run lint

      - name: Test Zica.ai
        run: npm run test:zica

      - name: Build Zica.ai
        run: npm run build:zica

      - name: Upload Zica.ai production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zica-ai-web-dist
          path: dist
          if-no-files-found: error
