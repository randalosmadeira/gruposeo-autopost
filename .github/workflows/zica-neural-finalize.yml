name: Zica.ai Neural Product Finalizer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply neural product patches
        run: python scripts/zica_neural_finalize.py

      - name: Validate PHP syntax
        run: find public/wordpress-plugin/zica-ai -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Commit final product layer
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "Zica.ai Automation"
          git config user.email "automation@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply neural cortex across Zica.ai product"
          git push origin HEAD:main
