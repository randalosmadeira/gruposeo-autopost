name: Apply repost runtime fix

on:
  push:
    branches:
      - fix/repost-image-seo-rss-runtime-20260903
    paths:
      - scripts/apply-repost-runtime-fix.mjs
      - .github/workflows/apply-repost-runtime-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-repost-runtime-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip apply]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/repost-image-seo-rss-runtime-20260903

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add autonomous editorial policy contracts
        run: |
          if ! git merge-base --is-ancestor 9bade7fcfdbc458444b8cc882ab917b64ad01b86 HEAD; then
            git cherry-pick 9bade7fcfdbc458444b8cc882ab917b64ad01b86
          fi

      - name: Apply guarded runtime patch
        run: node scripts/apply-repost-runtime-fix.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm run test:zica

      - name: Build production bundle
        run: npm run build:zica

      - name: Commit tested source
        run: |
          git add src supabase docs scripts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: enforce image SEO and RSS runtime guards [skip apply]"
            git push origin HEAD:fix/repost-image-seo-rss-runtime-20260903
          fi
