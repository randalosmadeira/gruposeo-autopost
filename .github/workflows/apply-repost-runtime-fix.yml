name: Apply repost runtime fix

on:
  push:
    branches:
      - fix/repost-image-seo-rss-runtime-20260903
    paths:
      - scripts/apply-repost-runtime-fix.mjs
      - scripts/repost-runtime-payload/**
      - .github/workflows/apply-repost-runtime-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-repost-runtime-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip apply]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/repost-image-seo-rss-runtime-20260903

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add autonomous editorial policy contracts
        run: |
          if ! git merge-base --is-ancestor 9bade7fcfdbc458444b8cc882ab917b64ad01b86 HEAD; then
            git cherry-pick 9bade7fcfdbc458444b8cc882ab917b64ad01b86
          fi

      - name: Reconstruct validated runtime patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '48d3108a39070d3b8a339d84df6c6fab5b0d400fd7b16a6f56c99fedbfadcbd8' scripts/repost-runtime-payload/part-00.b64 | sha256sum -c -
          printf '%s  %s\n' '398b6b917f3eedab33b1db7bdfd1701f196e4152b2096571e1f3e0e1697c5b69' scripts/repost-runtime-payload/part-01.b64 | sha256sum -c -
          printf '%s  %s\n' 'f738b1c02af517052412e1b6351db65b6f3b209c3258d3a7d309aff9852ab0b7' scripts/repost-runtime-payload/part-02.b64 | sha256sum -c -
          printf '%s  %s\n' 'f9c53d389c373745adcac4fe77388cc0c939883682db691eb8ff13ce912d720e' scripts/repost-runtime-payload/part-03.b64 | sha256sum -c -
          printf '%s  %s\n' '87c10a306690a97b688b469efd597360dcbfcdf3f5577b239868f1b2f62988a0' scripts/repost-runtime-payload/part-04.b64 | sha256sum -c -
          printf '%s  %s\n' 'afdc5b7b0b91f1a3e49a782a1500c13b447c5ee10930055fc94e1755a2281f6b' scripts/repost-runtime-payload/part-05.b64 | sha256sum -c -
          printf '%s  %s\n' '59a05a8c0e82310fc36a7e3209ee353214aaf1ebc4a3958229bfc129046b782d' scripts/repost-runtime-payload/part-06.b64 | sha256sum -c -
          printf '%s  %s\n' 'a0d6674114e99d216b0e6904ca2c71b76414b9553499a818988b3e446749a4ab' scripts/repost-runtime-payload/part-07.b64 | sha256sum -c -
          cat scripts/repost-runtime-payload/part-{00..07}.b64 > /tmp/apply-repost-runtime-fix.gz.b64
          printf '%s  %s\n' '551d7d0a9b1ffeee1f897aa0beef1f4569a3515617310ff2cf33666a3c8acda8' /tmp/apply-repost-runtime-fix.gz.b64 | sha256sum -c -
          base64 --decode /tmp/apply-repost-runtime-fix.gz.b64 | gzip --decompress > /tmp/apply-repost-runtime-fix.mjs
          printf '%s  %s\n' '11a6e8a6be520f8ec8efcc768935f33cbc31394287474e2368aade0080d902f2' /tmp/apply-repost-runtime-fix.mjs | sha256sum -c -
          node --check /tmp/apply-repost-runtime-fix.mjs

      - name: Apply guarded runtime patch
        run: |
          node /tmp/apply-repost-runtime-fix.mjs
          rm -f scripts/apply-repost-runtime-fix.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm run test:zica

      - name: Build production bundle
        run: npm run build:zica

      - name: Commit tested source
        run: |
          git add src supabase docs scripts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: enforce image SEO and RSS runtime guards [skip apply]"
            git push origin HEAD:fix/repost-image-seo-rss-runtime-20260903
          fi
