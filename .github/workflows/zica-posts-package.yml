name: Zica Posts 3.10.0 Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/zica-posts-3.10.0
    paths:
      - 'public/wordpress-plugin/zica-posts/**'
      - 'public/wordpress-theme/zica-neural/**'
      - '.github/workflows/zica-posts-package.yml'

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find public/wordpress-plugin/zica-posts public/wordpress-theme/zica-neural -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate plugin identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Plugin Name: Zica Posts' public/wordpress-plugin/zica-posts/zica-posts.php
          grep -q 'Version: 3.10.0' public/wordpress-plugin/zica-posts/zica-posts.php
          grep -q "define('ZICA_POSTS_SOFTWARE_ID', 'zica-posts')" public/wordpress-plugin/zica-posts/zica-posts.php
          grep -q '"version": "3.10.0"' public/wordpress-plugin/zica-posts/version.json
          grep -q 'Theme Name: Zica Neural Publisher' public/wordpress-theme/zica-neural/style.css

      - name: Validate JSON manifests
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool public/wordpress-plugin/zica-posts/version.json >/dev/null
          python -m json.tool public/wordpress-theme/zica-neural/theme.json >/dev/null

      - name: Build installable ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-wordpress
          (
            cd public/wordpress-plugin
            zip -rq ../../dist-wordpress/zica-posts-3.10.0.zip zica-posts -x '*.DS_Store' '*/.git/*'
          )
          (
            cd public/wordpress-theme
            zip -rq ../../dist-wordpress/zica-neural-theme-1.0.0.zip zica-neural -x '*.DS_Store' '*/.git/*'
          )
          unzip -t dist-wordpress/zica-posts-3.10.0.zip
          unzip -t dist-wordpress/zica-neural-theme-1.0.0.zip

      - name: Upload WordPress packages
        uses: actions/upload-artifact@v4
        with:
          name: zica-wordpress-3.10.0
          path: dist-wordpress/*.zip
          if-no-files-found: error
          retention-days: 30
