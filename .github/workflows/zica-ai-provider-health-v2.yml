name: Zica.ai Provider Health v2

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/zica-ai-provider-health-v2.yml

permissions:
  contents: read

jobs:
  provider-health:
    runs-on: ubuntu-latest
    environment: zica-ai-production
    steps:
      - name: Validate isolated image provider
        env:
          PROJECT_SECRET: ${{ secrets.ZICA_AI_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROJECT_SECRET"
          URL='https://ubahrbgaxrkjxklytobl.supabase.co/functions/v1/zica-ai-provider-health'
          status="$(curl --retry 3 --retry-delay 2 -sS -o /tmp/health.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $PROJECT_SECRET" \
            -H "apikey: $PROJECT_SECRET" \
            --data '{}' \
            "$URL")"
          python3 -m json.tool /tmp/health.json
          test "$status" = '200'
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/health.json', encoding='utf-8'))
          assert p.get('ok') is True
          o=p.get('openai',{})
          assert o.get('configured') is True
          assert o.get('reachable') is True
          assert o.get('modelResolved') == 'gpt-image-2'
          print('Provider OK:', o.get('modelResolved'))
          print('Key source:', o.get('keySource'))
          print('Claude QA configured:', p.get('anthropic',{}).get('configured'))
          PY
