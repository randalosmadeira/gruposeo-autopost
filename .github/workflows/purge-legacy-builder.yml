name: Purge legacy builder references

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/purge-legacy-builder.yml

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace residual references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "https://gruposeo-autopost.lovable.app/api/plugin-updates": "https://raw.githubusercontent.com/randalosmadeira/gruposeo-autopost/main/public/wordpress-plugin/contentfactory-rdm/version.json",
              "https://gruposeo-autopost.lovable.app/wordpress-plugin/contentfactory-rdm/": "https://github.com/randalosmadeira/gruposeo-autopost/releases/latest/download/contentfactory-rdm.zip",
              "https://gruposeo-autopost.lovable.app/wordpress-plugin": "https://github.com/randalosmadeira/gruposeo-autopost/tree/main/public/wordpress-plugin",
          }

          targets = [
              Path("public/wordpress-plugin/contentfactory-rdm/includes/class-cfrdm-auto-update.php"),
              Path("public/wordpress-plugin/contentfactory-rdm/includes/class-cfrdm-api.php"),
              Path("public/wordpress-plugin/contentfactory-rdm/version.json"),
          ]

          for path in targets:
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Verify source tree
        shell: bash
        run: |
          if grep -RniE 'lovable|gpt-engineer|lovable-tagger' . \
            --exclude-dir=.git \
            --exclude='purge-legacy-builder.yml'; then
            echo 'Residual legacy builder reference found.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No residual references to commit.'
            exit 0
          fi
          git config user.name 'Grupo SEO Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add public/wordpress-plugin/contentfactory-rdm
          git commit -m 'chore: purge residual builder URLs from WordPress plugin'
          git push origin HEAD:main
