name: Purge legacy builder references

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/purge-legacy-builder.yml

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace residual references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "https://gruposeo-autopost.lovable.app/api/plugin-updates": "https://raw.githubusercontent.com/randalosmadeira/gruposeo-autopost/main/public/wordpress-plugin/contentfactory-rdm/version.json",
              "https://gruposeo-autopost.lovable.app/wordpress-plugin/contentfactory-rdm/": "https://github.com/randalosmadeira/gruposeo-autopost/releases/latest/download/contentfactory-rdm.zip",
              "https://gruposeo-autopost.lovable.app/wordpress-plugin": "https://github.com/randalosmadeira/gruposeo-autopost/tree/main/public/wordpress-plugin",
              "Powered by Lovable AI · ": "IA multi-provedor · ",
              "(não usar Lovable AI conforme instrução).": "(usar somente provedores de IA configurados).",
              "NO Lovable AI Gateway - Direct Gemini API calls only.": "Direct provider API calls only.",
          }

          targets = [
              Path("public/wordpress-plugin/contentfactory-rdm/includes/class-cfrdm-auto-update.php"),
              Path("public/wordpress-plugin/contentfactory-rdm/includes/class-cfrdm-api.php"),
              Path("public/wordpress-plugin/contentfactory-rdm/version.json"),
              Path("public/api/plugin-updates.json"),
              Path("src/pages/AIChat.tsx"),
              Path("docs/AUDIT_GEO_SEO_2026.md"),
              Path("supabase/functions/_shared/gemini.ts"),
          ]

          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")

          gitignore = Path(".gitignore")
          if gitignore.exists():
              lines = gitignore.read_text(encoding="utf-8").splitlines()
              lines = [line for line in lines if line.strip() not in {".lovable/", "*lovable*"}]
              gitignore.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Verify source tree
        shell: bash
        run: |
          if grep -RniE 'lovable|gpt-engineer|lovable-tagger|gptengineer|gpt-eng' . \
            --exclude-dir=.git \
            --exclude='purge-legacy-builder.yml'; then
            echo 'Residual legacy builder reference found.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No residual references to commit.'
            exit 0
          fi
          git config user.name 'Grupo SEO Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add -A
          git commit -m 'chore: purge all residual legacy builder references'
          git push origin HEAD:main
