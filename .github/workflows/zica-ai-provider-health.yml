name: Zica.ai Provider Health

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/zica-ai-provider-health.yml

permissions:
  contents: read

jobs:
  provider-health:
    runs-on: ubuntu-latest
    environment: zica-ai-production
    steps:
      - name: Validate OpenAI provider through Zica.ai Vault
        env:
          SERVICE_ROLE: ${{ secrets.ZICA_AI_SUPABASE_SERVICE_ROLE_KEY }}
          HEALTH_URL: https://ubahrbgaxrkjxklytobl.supabase.co/functions/v1/zica-ai-provider-health
        run: |
          set -euo pipefail
          test -n "$SERVICE_ROLE"
          status="$(curl --retry 3 --retry-delay 2 -sS -o /tmp/provider-health.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $SERVICE_ROLE" \
            -H "apikey: $SERVICE_ROLE" \
            -H "x-zica-internal: $SERVICE_ROLE" \
            --data '{}' \
            "$HEALTH_URL")"
          cat /tmp/provider-health.json | python3 -m json.tool
          test "$status" = "200"
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/provider-health.json', encoding='utf-8'))
          assert p.get('ok') is True
          assert p.get('openai',{}).get('configured') is True
          assert p.get('openai',{}).get('reachable') is True
          assert p.get('openai',{}).get('modelResolved') == 'gpt-image-2'
          print('OpenAI provider health passed.')
          print('Key source:', p.get('openai',{}).get('keySource'))
          print('Claude QA configured:', p.get('anthropic',{}).get('configured'))
          PY
