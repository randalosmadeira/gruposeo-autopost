name: Supporter Avatar 1470 Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supporter-avatar-smoke.yml'
      - 'src/pages/SupporterAvatar1470V2.tsx'
      - 'supabase/functions/supporter-avatar-public-v2/**'
      - 'supabase/functions/supporter-avatar-candidate-assets/**'
      - 'supabase/functions/generate-supporter-avatar/**'
      - 'supabase/functions/_shared/supporter-avatar-prompt.ts'

permissions:
  contents: read

concurrency:
  group: supporter-avatar-1470-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://app.zica.posts.zicajuris.com.br
      EDGE_URL: https://ubahrbgaxrkjxklytobl.supabase.co/functions/v1/supporter-avatar-public-v2
      CANDIDATE_ASSETS_URL: https://ubahrbgaxrkjxklytobl.supabase.co/functions/v1/supporter-avatar-candidate-assets
    steps:
      - name: Verify public /1470 route
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --retry 3 --retry-delay 2 -L -sS -o /tmp/1470.html -w '%{http_code}' "$APP_URL/1470")"
          test "$status" = "200"
          grep -q 'id="root"' /tmp/1470.html
          echo "Public /1470 returned HTTP 200 with SPA root."

      - name: Verify auto-selector public contract
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 -fsS \
            -H 'Content-Type: application/json' \
            --data '{"action":"capabilities"}' \
            "$EDGE_URL" > /tmp/capabilities.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/capabilities.json', encoding='utf-8'))
          assert p.get('ok') is True
          assert p.get('pipeline') == 'auto-selector-v2'
          assert p.get('candidateSelection') == 'private-automatic'
          assert p.get('publicCandidateGallery') is False
          assert p.get('socialOutputs') == ['1080x1080','1080x1350','1200x630']
          forbidden=('candidatePreset','candidate_preset','previewUrl','drive','storage_path','file_id','download_url')
          raw=json.dumps(p, ensure_ascii=False).lower()
          for key in forbidden:
              assert key.lower() not in raw, key
          print('Public contract has no private candidate metadata.')
          PY

      - name: Verify candidate gallery rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/private.json -w '%{http_code}' "$CANDIDATE_ASSETS_URL")"
          test "$code" = "401" -o "$code" = "403"
          python - <<'PY'
          import json
          p=json.load(open('/tmp/private.json', encoding='utf-8'))
          assert p.get('error') in ('ceo_access_required','authorization_required')
          PY
          echo "Candidate assets anonymous access denied with HTTP $code."

      - name: Verify no legacy dispatch symbol in active repository runtime
        uses: actions/checkout@v4

      - name: Scan active 1470 runtime
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/pages/SupporterAvatar1470V2.tsx
            supabase/functions/supporter-avatar-public-v2/index.ts
            supabase/functions/generate-supporter-avatar/index.ts
            supabase/functions/supporter-avatar-candidate-assets/index.ts
            supabase/functions/_shared/supporter-avatar-prompt.ts
          )
          if grep -Ein 'legacy[_-]dispatch' "${files[@]}"; then
            echo 'Legacy dispatch reference remains in active runtime.' >&2
            exit 1
          fi
          echo 'No legacy dispatch reference in active runtime.'

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Supporter Avatar /1470 smoke'
            echo ''
            echo '- Public route: HTTP 200'
            echo '- Pipeline contract: auto-selector-v2'
            echo '- Candidate gallery: anonymous access denied'
            echo '- Public candidate metadata: absent'
            echo '- Social pack: 1080x1080, 1080x1350, 1200x630'
            echo '- Legacy dispatch reference in active runtime: absent'
          } >> "$GITHUB_STEP_SUMMARY"
