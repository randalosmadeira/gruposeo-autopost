name: Supporter Avatar 1470 Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/supporter-avatar-smoke.yml'

permissions:
  contents: read

concurrency:
  group: supporter-avatar-1470-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://app.zica.posts.zicajuris.com.br
      EDGE_URL: https://ubahrbgaxrkjxklytobl.supabase.co/functions/v1/supporter-avatar-public
    steps:
      - name: Verify public /1470 route
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --retry 3 --retry-delay 2 -L -sS -o /tmp/1470.html -w '%{http_code}' "$APP_URL/1470")"
          test "$status" = "200"
          grep -q 'id="root"' /tmp/1470.html
          echo "Public /1470 returned HTTP 200 with SPA root."

      - name: Read safe provider capabilities
        id: caps
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 -fsS \
            -H 'Content-Type: application/json' \
            --data '{"action":"capabilities"}' \
            "$EDGE_URL" > /tmp/capabilities.json
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/capabilities.json', encoding='utf-8'))
          assert p.get('ok') is True
          image=bool(p.get('imageProvider',{}).get('configured'))
          qa=bool(p.get('qaProvider',{}).get('configured'))
          turnstile=bool(p.get('abuseProtection',{}).get('turnstileConfigured'))
          model=str(p.get('imageProvider',{}).get('model') or '')
          with open(os.environ['GITHUB_OUTPUT'],'a', encoding='utf-8') as f:
              f.write(f'openai={str(image).lower()}\n')
              f.write(f'anthropic={str(qa).lower()}\n')
              f.write(f'turnstile={str(turnstile).lower()}\n')
              f.write(f'model={model}\n')
          print('Capabilities endpoint responded successfully.')
          print('Image provider configured:', image)
          print('Optional QA provider configured:', qa)
          print('Turnstile configured:', turnstile)
          print('Image model:', model)
          PY

      - name: Verify tokenized request lifecycle
        if: steps.caps.outputs.turnstile != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H 'Content-Type: application/json' \
            --data '{"action":"create","supporterName":"Smoke Test 1470","city":"Sao Paulo","state":"SP","supportText":"EU APOIO DR. MADEIRA 1470","style":"clean","socialHandles":{"instagram":"@smoke_test_not_real"},"consentImageUse":true,"consentSocialLinking":true,"consentTerms":true,"consentPublicGallery":false}' \
            "$EDGE_URL" > /tmp/create.json

          eval "$(python - <<'PY'
          import json, shlex
          p=json.load(open('/tmp/create.json', encoding='utf-8'))
          assert p.get('ok') is True
          assert p.get('requestId') and p.get('token')
          print('REQUEST_ID='+shlex.quote(p['requestId']))
          print('REQUEST_TOKEN='+shlex.quote(p['token']))
          PY
          )"

          curl -fsS \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"status\",\"requestId\":\"$REQUEST_ID\",\"token\":\"$REQUEST_TOKEN\"}" \
            "$EDGE_URL" > /tmp/status.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/status.json', encoding='utf-8'))
          assert p.get('ok') is True
          assert p.get('request',{}).get('status') == 'uploading'
          PY

          submit_status="$(curl -sS -o /tmp/submit.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"submit\",\"requestId\":\"$REQUEST_ID\",\"token\":\"$REQUEST_TOKEN\"}" \
            "$EDGE_URL")"
          test "$submit_status" = "422"
          python - <<'PY'
          import json
          p=json.load(open('/tmp/submit.json', encoding='utf-8'))
          assert p.get('error') == 'upload_at_least_one_photo'
          PY

          curl -fsS \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"delete\",\"requestId\":\"$REQUEST_ID\",\"token\":\"$REQUEST_TOKEN\"}" \
            "$EDGE_URL" > /tmp/delete.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/delete.json', encoding='utf-8'))
          assert p.get('ok') is True and p.get('deleted') is True
          PY
          unset REQUEST_TOKEN
          echo "Create/status/guard/delete lifecycle passed."

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Supporter Avatar /1470 smoke'
            echo ''
            echo '- Public route: ✅ HTTP 200'
            echo '- Public Edge API: ✅'
            echo '- Tokenized lifecycle: ${{ steps.caps.outputs.turnstile == 'true' && 'skipped (Turnstile enabled)' || '✅' }}'
            echo '- OpenAI image provider configured: `${{ steps.caps.outputs.openai }}`'
            echo '- OpenAI image model: `${{ steps.caps.outputs.model }}`'
            echo '- Claude QA configured: `${{ steps.caps.outputs.anthropic }}`'
            echo '- Turnstile configured: `${{ steps.caps.outputs.turnstile }}`'
          } >> "$GITHUB_STEP_SUMMARY"
