          deploy.write_text('''name: Zica.ai Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ZICA_AI_ARTIFACT_NAME: zica-ai-web-dist
  ZICA_AI_DEPLOY_BUCKET: zica-ai-web
  ZICA_AI_BUILD_TAG: zica-ai-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZICA_AI_ARTIFACT_NAME }}
          path: dist
          if-no-files-found: error
      - name: Trigger authorized deployment target
        if: ${{ secrets.ZICA_AI_DEPLOY_WEBHOOK_URL != '' }}
        env:
          DEPLOY_URL: ${{ secrets.ZICA_AI_DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.ZICA_AI_DEPLOY_TOKEN }}
        run: |
          curl --fail --silent --show-error --request POST "$DEPLOY_URL" \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"app\":\"Zica.ai\",\"artifact\":\"${ZICA_AI_ARTIFACT_NAME}\",\"bucket\":\"${ZICA_AI_DEPLOY_BUCKET}\",\"tag\":\"${ZICA_AI_BUILD_TAG}\"}"
''', encoding='utf-8')

