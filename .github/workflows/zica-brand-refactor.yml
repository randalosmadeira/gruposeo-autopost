name: Zica.ai Brand Refactor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/zica-brand-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Zica.ai refactor
        run: python .github/scripts/zica_brand_refactor.py
      - name: Verify canonical branding
        run: |
          test -f public/favicon.svg
          test -f public/site.webmanifest
          test -f public/wordpress-plugin/zica-ai/zica-ai-connector.php
          grep -q '"name": "zica-ai"' package.json
          grep -q 'Zica.ai' index.html
          grep -q '#D4FF00' src/index.css
          grep -q 'zica-ai/v1' public/wordpress-plugin/zica-ai/zica-ai-connector.php
          if grep -RniE 'ContentFactory RDM|GRUPO SEO MKT|Powered by Lovable' src index.html README.md public/wordpress-plugin/zica-ai --exclude-dir=.git; then
            echo 'Residual visible legacy branding found.' >&2
            exit 1
          fi
      - name: Commit refactor
        run: |
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/purge-legacy-builder.yml .github/workflows/zica-brand-refactor.yml
          git config user.name 'Zica.ai Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: rename platform and plugin to Zica.ai'
          git push origin HEAD:main
