name: Zica.ai WordPress Prefix Refactor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/zica-brand-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Refactor canonical plugin prefixes
        run: python .github/scripts/zica_plugin_prefix_refactor.py
      - name: PHP syntax validation
        run: find public/wordpress-plugin/zica-ai -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify canonical identifiers
        run: |
          grep -q "define('ZICA_AI_VERSION'" public/wordpress-plugin/zica-ai/zica-ai-connector.php
          grep -q '/zica-ai/v1/' public/wordpress-plugin/zica-ai/zica-ai-connector.php
          if grep -RniE 'function[[:space:]]+cfrdm_|class[[:space:]]+CFRDM_|class-cfrdm-' public/wordpress-plugin/zica-ai --include='*.php'; then
            echo 'Legacy PHP identifier remains outside compatibility storage.' >&2
            exit 1
          fi
      - name: Commit canonical plugin refactor
        run: |
          rm -f .github/scripts/zica_plugin_prefix_refactor.py
          git config user.name 'Zica.ai Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: canonicalize Zica.ai WordPress identifiers'
          git push origin HEAD:main
