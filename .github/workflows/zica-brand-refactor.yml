name: Zica.ai API Contract Refactor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/zica-brand-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Refactor Zica.ai API contract
        run: python .github/scripts/zica_api_contract_refactor.py
      - name: Validate plugin PHP
        run: find public/wordpress-plugin/zica-ai -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify canonical contract
        run: |
          grep -q "X-ZICA-AI-API-Key" public/wordpress-plugin/zica-ai/includes/class-zica-ai-api.php
          grep -q '/wp-json/zica-ai/v1/articles' supabase/functions/publish-to-wordpress/index.ts
          grep -q 'X-ZICA-AI-API-Key' supabase/functions/publish-to-wordpress/index.ts
      - name: Commit API contract
        run: |
          rm -f .github/scripts/zica_api_contract_refactor.py
          git config user.name 'Zica.ai Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: align Zica.ai WordPress API contract'
          git push origin HEAD:main
