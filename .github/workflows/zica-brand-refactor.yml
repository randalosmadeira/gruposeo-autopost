            'GRUPO SEO MARKETING':'Zica.ai',
            'Plataforma interna de geração de conteúdo SEO':'Seu tráfego tá na zica? Deszica com Zica.ai.',
            'Criar Conteúdo':'Gerar Onda de Conteúdo',
            'Painel Geral':'Cérebro de Tráfego',
            'Otimização SEO':'GEO & Semântica LLMs',
            'Novo Artigo':'Gerar Onda',
            'Artigos IA':'Ondas IA',
          }
          for path in list((root/'src').rglob('*.tsx')) + list((root/'src').rglob('*.ts')):
              text = path.read_text(encoding='utf-8')
              for old,new in ui_replacements.items(): text = text.replace(old,new)
              text = text.replace("import logoSeo from '@/assets/logo-grupo-seo.png';\n", '')
              text = text.replace('label: \'Painel\'', "label: 'Cérebro de Tráfego'")
              text = text.replace('Buscar artigos, projetos...', 'Buscar ondas, projetos e sinais...')
              text = text.replace('/wp-json/cfrdm/v1/', '/wp-json/zica-ai/v1/')
              path.write_text(text, encoding='utf-8')

          sidebar = root/'src/components/layout/Sidebar.tsx'
          s = sidebar.read_text(encoding='utf-8')
          s = re.sub(r'<img\s+src=\{logoSeo\}\s+alt="Zica\.ai"\s+className="w-10 h-10 rounded-xl transition-transform duration-300 hover:scale-110"\s*/>', '<div className="w-10 h-10 rounded-xl bg-primary text-primary-foreground font-black text-xl flex items-center justify-center shadow-glow-primary">Z</div>', s)
          s = s.replace('<p>Zica.ai</p>\n            <p className="text-xs text-muted-foreground">by Zica.ai</p>', '<p className="font-bold">Zica.ai</p>\n            <p className="text-xs text-muted-foreground">Cérebro de Tráfego 24/7</p>')
