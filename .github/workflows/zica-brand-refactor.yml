              a = auth.read_text(encoding='utf-8')
              a = a.replace('Plataforma interna de geração de conteúdo SEO', 'Seu tráfego tá na zica? Deszica com Zica.ai.')
              auth.write_text(a, encoding='utf-8')

          # README
          (root/'README.md').write_text('''# Zica.ai

![Zica.ai - Autonomous Organic Traffic Engine](https://img.shields.io/badge/Zica.ai-Autonomous_Organic_Traffic_Engine-D4FF00?style=for-the-badge&labelColor=0D1117)

**Seu tráfego tá na zica? Deszica com Zica.ai.**

Zica.ai é um SaaS de automação de tráfego orgânico, produção editorial, GEO e otimização semântica para mecanismos de busca e LLMs. O sistema coordena artigos, ondas virais, IndexNow, `llms.txt`, linkagem interna, auditoria técnica e publicação WordPress para nichos como Advocacia, Saúde, Imobiliário, Educação e E-commerce.

## Conceito

**Cérebro Central de Tráfego Orgânico e Ondas Virais 24/7**, combinando SEO, GEO e Semântica LLMs para superfícies como ChatGPT, Perplexity e Claude.

## Arquitetura

```mermaid
flowchart LR
  A[Cérebro Central Zica.ai] --> B[Ondas Virais de Conteúdo]
  B --> C[GEO e Semântica LLMs]
  C --> D[IndexNow / llms.txt / Search]
  D --> E[WordPress Plugin Zica.ai]
  E --> F[Publicação e Manutenção Autônoma]
  F --> A
```

## Stack

- React 18 + TypeScript + Vite
- Tailwind CSS + shadcn/ui
- Supabase Database, Auth e Edge Functions
- OpenAI, Gemini e Anthropic via BYOK ou configuração de plataforma
- WordPress REST API + plugin oficial Zica.ai
- IndexNow, `llms.txt`, linkagem interna e automações editoriais

## Variáveis de ambiente

Copie `.env.example` para o ambiente de execução e configure apenas os valores necessários.

```bash
VITE_APP_NAME="Zica.ai"
VITE_SUPABASE_URL="https://PROJECT_REF.supabase.co"
VITE_SUPABASE_PUBLISHABLE_KEY="sb_publishable_..."
SUPABASE_URL="https://PROJECT_REF.supabase.co"
SUPABASE_PUBLISHABLE_KEY="sb_publishable_..."
SUPABASE_SECRET_KEY="sb_secret_..."
OPENAI_API_KEY=""
GEMINI_API_KEY=""
ANTHROPIC_API_KEY=""
```

Nunca publique `SUPABASE_SECRET_KEY` ou chaves privadas no frontend.

## Instalação

```bash
npm install
npm run dev
```

## Testes e validação

```bash
npm run test
npm run build
npm run lint
```

O lint permanece como diagnóstico durante a estabilização da dívida técnica legada. Testes e build são bloqueantes no CI.

## Deploy

O workflow `.github/workflows/deploy.yml` gera o artefato `zica-ai-web-dist`. A publicação externa usa secrets dedicados com prefixo `ZICA_AI_` e deve apontar somente para o ambiente autorizado.

## Plugin WordPress

Código canônico: `public/wordpress-plugin/zica-ai/zica-ai-connector.php`.

Namespace REST canônico: `/wp-json/zica-ai/v1/`.

O namespace legado permanece temporariamente como alias de compatibilidade para evitar quebra de integrações instaladas.

## Segurança

- RLS obrigatório nas tabelas públicas expostas.
- Chaves secretas apenas em backend, Vault ou Edge Function secrets.
- Idempotência em processamento RSS e publicação.
- Nenhum executor remoto genérico de SQL faz parte da superfície da aplicação.

© 2026 Zica.ai.
''', encoding='utf-8')

          # env example
          (root/'.env.example').write_text('''VITE_APP_NAME="Zica.ai"
VITE_SUPABASE_URL="https://PROJECT_REF.supabase.co"
VITE_SUPABASE_PUBLISHABLE_KEY="sb_publishable_..."
