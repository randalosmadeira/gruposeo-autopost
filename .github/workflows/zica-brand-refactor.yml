          tpl.mkdir(parents=True, exist_ok=True)
          template = '''<!doctype html><html><body style="margin:0;background:#0D1117;color:#F0F6FC;font-family:Arial,sans-serif"><table width="100%" cellpadding="0" cellspacing="0" style="background:#0D1117;padding:32px"><tr><td align="center"><table width="560" cellpadding="0" cellspacing="0" style="background:#161B22;border:1px solid #30363D;border-radius:16px;padding:32px"><tr><td><div style="font-size:28px;font-weight:800;color:#D4FF00">Zica.ai</div><p style="color:#8B949E">Cérebro de Tráfego</p><h2 style="color:#F0F6FC">{{TITLE}}</h2><p style="color:#C9D1D9;line-height:1.6">{{BODY}}</p><p><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#D4FF00;color:#0D1117;text-decoration:none;font-weight:800;padding:14px 22px;border-radius:10px">{{CTA}}</a></p><p style="color:#8B949E;font-size:12px">Se você não iniciou esta ação, ignore esta mensagem.</p></td></tr></table></td></tr></table></body></html>'''
          (tpl/'confirmation.html').write_text(template.replace('{{TITLE}}','Confirme seu acesso à Zica.ai').replace('{{BODY}}','Confirme seu e-mail para ativar o Cérebro de Tráfego.').replace('{{CTA}}','Confirmar cadastro'), encoding='utf-8')
          (tpl/'magic_link.html').write_text(template.replace('{{TITLE}}','Acesse seu Cérebro de Tráfego - Zica.ai').replace('{{BODY}}','Use o botão abaixo para entrar com segurança.').replace('{{CTA}}','Acessar Zica.ai'), encoding='utf-8')
          (tpl/'recovery.html').write_text(template.replace('{{TITLE}}','Redefina sua senha da Zica.ai').replace('{{BODY}}','Recebemos uma solicitação de recuperação de acesso.').replace('{{CTA}}','Redefinir senha'), encoding='utf-8')

          config = root/'supabase/config.toml'
          if config.exists():
              ct = config.read_text(encoding='utf-8')
              blocks = '''

[auth.email.template.confirmation]
subject = "Acesse seu Cérebro de Tráfego - Zica.ai"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Acesse seu Cérebro de Tráfego - Zica.ai"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Acesse seu Cérebro de Tráfego - Zica.ai"
content_path = "./supabase/templates/recovery.html"
'''
              if '[auth.email.template.confirmation]' not in ct:
                  ct += blocks
              config.write_text(ct, encoding='utf-8')

          # Remove obsolete local branding asset and temporary old cleanup workflow
          old_logo = root/'src/assets/logo-grupo-seo.png'
          if old_logo.exists(): old_logo.unlink()
          purge = root/'.github/workflows/purge-legacy-builder.yml'
          if purge.exists(): purge.unlink()
          me = root/'.github/workflows/zica-brand-refactor.yml'
          if me.exists(): me.unlink()
          PY

      - name: Verify Zica.ai canonical branding
        shell: bash
        run: |
          test -f public/favicon.svg
          test -f public/site.webmanifest
          test -f public/wordpress-plugin/zica-ai/zica-ai-connector.php
          grep -q '"name": "zica-ai"' package.json
          grep -q 'Zica.ai' index.html
          grep -q '#D4FF00' src/index.css
          grep -q 'zica-ai/v1' public/wordpress-plugin/zica-ai/zica-ai-connector.php
          ! grep -RniE 'ContentFactory RDM|GRUPO SEO MKT|Powered by Lovable' src index.html README.md public/wordpress-plugin/zica-ai --exclude-dir=.git

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'Zica.ai Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: rename platform and plugin to Zica.ai'
          git push origin HEAD:main
