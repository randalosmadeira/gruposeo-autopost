# User-facing functions validated by the Supabase gateway JWT layer.
[functions.generate-article]
verify_jwt = true

[functions.news-agent]
verify_jwt = true

[functions.generate-authority-plan]
verify_jwt = true

[functions.generate-authority-plan-stream]
verify_jwt = true

# These functions participate in server-to-server chains. They validate either
# a real user JWT through auth.getUser(), an exact opaque service credential,
# or a dedicated automation secret inside the function body.
[functions.publish-to-wordpress]
verify_jwt = false

[functions.rewrite-news]
verify_jwt = false

[functions.generate-image]
verify_jwt = false

[functions.wordpress-operations]
verify_jwt = false

[functions.execute-news-agents]
verify_jwt = false

# Public supporter ingress uses its own short-lived public token and rate limits.
[functions.supporter-avatar-public]
verify_jwt = false

[functions.supporter-avatar-public-v2]
verify_jwt = false

# Internal supporter rendering validates the exact x-zica-internal secret in the function body.
# Gateway JWT verification must stay disabled because modern Supabase service secrets are opaque.
[functions.generate-supporter-avatar]
verify_jwt = false

# Administrative supporter database requires an authenticated user JWT and CEO role.
[functions.supporter-avatar-admin]
verify_jwt = true

[functions.regenerate-content]
verify_jwt = true

[functions.test-wordpress-connection]
verify_jwt = true

[functions.wordpress-api]
verify_jwt = true

[functions.articles-api]
verify_jwt = true

# External webhooks authenticate with application-level signatures/secrets.
[functions.webhooks]
verify_jwt = false

[functions.ai-api]
verify_jwt = true

[functions.generate-landing-page]
verify_jwt = true

[functions.parse-rss]
verify_jwt = true

[functions.generate-secondary-keywords]
verify_jwt = true

[functions.analyze-url-content]
verify_jwt = true

[functions.monitor-portals]
verify_jwt = true

[functions.auto-process-rss]
verify_jwt = true

[functions.seo-agent]
verify_jwt = true

[functions.ai-chat]
verify_jwt = true

[functions.analyze-seo-advanced]
verify_jwt = true

[functions.analyze-file]
verify_jwt = true

